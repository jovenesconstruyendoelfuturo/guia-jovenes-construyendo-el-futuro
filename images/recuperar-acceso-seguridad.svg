<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" aria-hidden="true" role="img">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad6)" rx="16"/>

  <circle cx="150" cy="140" r="90" fill="#e0f2fe" opacity="0.3"/>
  <circle cx="680" cy="300" r="100" fill="#ccfbf1" opacity="0.25"/>

  <!-- Centro: Pantalla de recuperación y validación segura -->
  <g filter="url(#shadow6)" transform="translate(230, 55)">
    <rect width="340" height="340" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Cabecera de seguridad -->
    <rect width="340" height="56" rx="16" fill="#0284c7"/>
    <rect y="40" width="340" height="16" fill="#0284c7"/>

    <!-- Candado en la cabecera -->
    <rect x="156" y="24" width="28" height="22" rx="4" fill="#ffffff"/>
    <path d="M 163,24 L 163,16 C 163,11 177,11 177,16 L 177,24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="170" cy="34" r="3" fill="#0284c7"/>

    <!-- Contenido del modal de recuperación -->
    <!-- Indicación y campo de correo / usuario -->
    <rect x="40" y="85" width="160" height="10" rx="3" fill="#1e293b"/>
    <rect x="40" y="105" width="260" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <!-- Icono de sobre/correo -->
    <rect x="52" y="117" width="18" height="14" rx="2" fill="#94a3b8"/>
    <polyline points="52,118 61,125 70,118" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="80" y1="124" x2="200" y2="124" stroke="#64748b" stroke-width="2"/>

    <!-- Campo de código de verificación de 6 dígitos -->
    <rect x="40" y="160" width="180" height="10" rx="3" fill="#1e293b"/>
    <g transform="translate(40, 180)">
      <rect x="0" y="0" width="36" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="18" cy="21" r="4" fill="#0284c7"/>

      <rect x="45" y="0" width="36" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="63" cy="21" r="4" fill="#0284c7"/>

      <rect x="90" y="0" width="36" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="108" cy="21" r="4" fill="#0284c7"/>

      <rect x="135" y="0" width="36" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="153" cy="21" r="4" fill="#0284c7"/>

      <rect x="180" y="0" width="36" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="225" y="0" width="36" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    </g>

    <!-- Botón de confirmar restablecimiento -->
    <rect x="40" y="245" width="260" height="40" rx="6" fill="#0284c7"/>
    <line x1="110" y1="265" x2="230" y2="265" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Enlace de ayuda o soporte -->
    <line x1="90" y1="308" x2="250" y2="308" stroke="#0f766e" stroke-width="2"/>
  </g>

  <!-- Teléfono móvil lateral recibiendo código por SMS -->
  <g filter="url(#shadow6)" transform="translate(70, 130)">
    <rect width="115" height="210" rx="14" fill="#1e293b"/>
    <rect x="6" y="10" width="103" height="190" rx="8" fill="#ffffff"/>
    <circle cx="57" cy="18" r="3" fill="#94a3b8"/>
    <!-- Burbuja de mensaje seguro -->
    <rect x="16" y="45" width="83" height="50" rx="6" fill="#e0f2fe"/>
    <line x1="24" y1="60" x2="80" y2="60" stroke="#0284c7" stroke-width="2.5"/>
    <line x1="24" y1="72" x2="68" y2="72" stroke="#0369a1" stroke-width="2"/>
    <circle cx="57" cy="185" r="7" fill="#e2e8f0"/>
  </g>

  <!-- Llave de acceso segura flotante derecha -->
  <g filter="url(#shadow6)" transform="translate(615, 140)">
    <circle cx="45" cy="45" r="35" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
    <!-- Icono de llave -->
    <circle cx="36" cy="36" r="12" fill="none" stroke="#d97706" stroke-width="3.5"/>
    <path d="M 45,45 L 62,62 M 56,56 L 60,52 M 60,60 L 64,56" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
