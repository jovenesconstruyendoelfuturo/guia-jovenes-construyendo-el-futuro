<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" aria-hidden="true" role="img">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad7)" rx="16"/>

  <!-- Círculos de alerta / protección suaves -->
  <circle cx="400" cy="225" r="170" fill="#fee2e2" opacity="0.4"/>
  <circle cx="400" cy="225" r="230" fill="#fee2e2" opacity="0.2"/>

  <!-- Escudo Central Grande de Ciberseguridad -->
  <g filter="url(#shadow7)" transform="translate(290, 60)">
    <path d="M 110,10 L 205,45 C 205,160 160,250 110,290 C 60,250 15,160 15,45 Z" fill="url(#shieldGrad)"/>
    <path d="M 110,22 L 192,52 C 192,152 153,235 110,272 C 67,235 28,152 28,52 Z" fill="#0369a1"/>

    <!-- Candado blanco central dentro del escudo -->
    <rect x="88" y="130" width="44" height="36" rx="6" fill="#ffffff"/>
    <path d="M 98,130 L 98,112 C 98,102 122,102 122,112 L 122,130" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="110" cy="145" r="4.5" fill="#0284c7"/>
    <line x1="110" y1="149" x2="110" y2="157" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

    <!-- Check de verificación oficial debajo -->
    <circle cx="110" cy="195" r="14" fill="#10b981"/>
    <path d="M 103,195 L 108,200 L 117,190" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Tarjeta Izquierda: Enlace Sospechoso / Falso bloqueado -->
  <g filter="url(#shadow7)" transform="translate(60, 110)">
    <rect width="210" height="180" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="40" rx="12" fill="#fee2e2"/>
    <rect x="0" y="28" width="210" height="12" fill="#fee2e2"/>

    <!-- Icono de advertencia en rojo -->
    <circle cx="28" cy="24" r="10" fill="#ef4444"/>
    <line x1="28" y1="19" x2="28" y2="25" stroke="#ffffff" stroke-width="2"/>
    <circle cx="28" cy="28.5" r="1" fill="#ffffff"/>
    <line x1="48" y1="24" x2="150" y2="24" stroke="#991b1b" stroke-width="2"/>

    <!-- Barra de dirección tachada (dominio falso) -->
    <rect x="15" y="55" width="180" height="32" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <line x1="25" y1="71" x2="140" y2="71" stroke="#dc2626" stroke-width="2"/>
    <!-- Cruz roja sobre el enlace fraudulento -->
    <line x1="155" y1="63" x2="175" y2="79" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="175" y1="63" x2="155" y2="79" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Advertencia de NO pagar cuotas -->
    <rect x="15" y="102" width="180" height="24" rx="4" fill="#f8fafc"/>
    <line x1="25" y1="114" x2="120" y2="114" stroke="#64748b" stroke-width="2"/>
    <rect x="15" y="134" width="180" height="24" rx="4" fill="#f8fafc"/>
    <line x1="25" y1="146" x2="150" y2="146" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Tarjeta Derecha: Trámite Oficial Gratuito y Directo -->
  <g filter="url(#shadow7)" transform="translate(530, 110)">
    <rect width="210" height="180" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="40" rx="12" fill="#d1fae5"/>
    <rect x="0" y="28" width="210" height="12" fill="#d1fae5"/>

    <!-- Icono de aprobación en verde -->
    <circle cx="28" cy="24" r="10" fill="#10b981"/>
    <path d="M 23,24 L 27,28 L 34,20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="24" x2="160" y2="24" stroke="#065f46" stroke-width="2"/>

    <!-- Barra de dirección oficial con candado verde -->
    <rect x="15" y="55" width="180" height="32" rx="4" fill="#f0fdf4" stroke="#86efac"/>
    <circle cx="28" cy="71" r="5" fill="#10b981"/>
    <line x1="40" y1="71" x2="165" y2="71" stroke="#065f46" stroke-width="2"/>

    <!-- Sin intermediarios / Trámite personal -->
    <rect x="15" y="102" width="180" height="24" rx="4" fill="#f8fafc"/>
    <line x1="25" y1="114" x2="135" y2="114" stroke="#10b981" stroke-width="2"/>
    <rect x="15" y="134" width="180" height="24" rx="4" fill="#f8fafc"/>
    <line x1="25" y1="146" x2="110" y2="146" stroke="#10b981" stroke-width="2"/>
  </g>
</svg>

