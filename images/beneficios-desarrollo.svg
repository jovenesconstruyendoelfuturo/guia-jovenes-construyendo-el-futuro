<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" aria-hidden="true" role="img">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad5)" rx="16"/>

  <!-- Rayos de luz / crecimiento sutiles -->
  <circle cx="400" cy="225" r="160" fill="#dcfce7" opacity="0.4"/>
  <circle cx="400" cy="225" r="230" fill="#dcfce7" opacity="0.2"/>

  <!-- 4 Bloques o tarjetas flotantes de beneficios formativos -->

  <!-- Bloque 1: Experiencia Laboral y Hábitos Profesionales (Arriba Izquierda) -->
  <g filter="url(#shadow5)" transform="translate(90, 70)">
    <rect width="280" height="135" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="135" rx="4" fill="#0284c7"/>
    <!-- Icono de maletín con estrella de progreso -->
    <circle cx="50" cy="50" r="24" fill="#e0f2fe"/>
    <rect x="38" y="44" width="24" height="16" rx="3" fill="#0284c7"/>
    <path d="M 45,44 L 45,40 C 45,38 47,37 50,37 C 53,37 55,38 55,40 L 55,44" fill="none" stroke="#0284c7" stroke-width="2"/>
    <!-- Textos abstractos -->
    <rect x="88" y="38" width="140" height="12" rx="3" fill="#1e293b"/>
    <rect x="88" y="58" width="160" height="8" rx="2" fill="#64748b"/>
    <rect x="88" y="74" width="120" height="8" rx="2" fill="#94a3b8"/>
    <!-- Estrellas de competencia adquirida -->
    <circle cx="50" cy="100" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="100" r="6" fill="#f59e0b"/>
    <circle cx="90" cy="100" r="6" fill="#f59e0b"/>
  </g>

  <!-- Bloque 2: Cobertura de Seguridad y Salud (Arriba Derecha) -->
  <g filter="url(#shadow5)" transform="translate(430, 70)">
    <rect width="280" height="135" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="135" rx="4" fill="#10b981"/>
    <!-- Icono de escudo de protección médica -->
    <circle cx="50" cy="50" r="24" fill="#dcfce7"/>
    <path d="M 50,34 L 62,39 C 62,50 56,58 50,62 C 44,58 38,50 38,39 Z" fill="#10b981"/>
    <!-- Cruz médica abstracta -->
    <rect x="48" y="43" width="4" height="10" fill="#ffffff"/>
    <rect x="45" y="46" width="10" height="4" fill="#ffffff"/>
    <!-- Textos abstractos -->
    <rect x="88" y="38" width="150" height="12" rx="3" fill="#1e293b"/>
    <rect x="88" y="58" width="165" height="8" rx="2" fill="#64748b"/>
    <rect x="88" y="74" width="130" height="8" rx="2" fill="#94a3b8"/>
    <!-- Indicador de respaldo activo -->
    <rect x="88" y="94" width="80" height="18" rx="9" fill="#ecfdf5"/>
    <circle cx="100" cy="103" r="4" fill="#059669"/>
    <line x1="110" y1="103" x2="150" y2="103" stroke="#059669" stroke-width="2"/>
  </g>

  <!-- Bloque 3: Apoyo Económico Mensual (Abajo Izquierda) -->
  <g filter="url(#shadow5)" transform="translate(90, 245)">
    <rect width="280" height="135" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="135" rx="4" fill="#f59e0b"/>
    <!-- Icono de tarjeta bancaria / depósito directo -->
    <circle cx="50" cy="50" r="24" fill="#fef3c7"/>
    <rect x="36" y="40" width="28" height="18" rx="3" fill="#d97706"/>
    <line x1="36" y1="46" x2="64" y2="46" stroke="#fef3c7" stroke-width="2"/>
    <rect x="40" y="52" width="6" height="3" fill="#fef3c7"/>
    <!-- Textos abstractos -->
    <rect x="88" y="38" width="145" height="12" rx="3" fill="#1e293b"/>
    <rect x="88" y="58" width="170" height="8" rx="2" fill="#64748b"/>
    <rect x="88" y="74" width="135" height="8" rx="2" fill="#94a3b8"/>
    <!-- Flecha de depósito directo sin intermediarios -->
    <path d="M 50,96 L 50,110 M 45,105 L 50,110 L 55,105" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="65" y1="103" x2="180" y2="103" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Bloque 4: Constancia de Acreditación / Habilidades (Abajo Derecha) -->
  <g filter="url(#shadow5)" transform="translate(430, 245)">
    <rect width="280" height="135" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="135" rx="4" fill="#0f766e"/>
    <!-- Icono de diploma / constancia de competencias -->
    <circle cx="50" cy="50" r="24" fill="#ccfbf1"/>
    <rect x="37" y="38" width="26" height="20" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <line x1="42" y1="44" x2="55" y2="44" stroke="#0f766e" stroke-width="1.5"/>
    <line x1="42" y1="49" x2="52" y2="49" stroke="#0f766e" stroke-width="1.5"/>
    <circle cx="56" cy="54" r="3" fill="#f59e0b"/>
    <!-- Textos abstractos -->
    <rect x="88" y="38" width="155" height="12" rx="3" fill="#1e293b"/>
    <rect x="88" y="58" width="160" height="8" rx="2" fill="#64748b"/>
    <rect x="88" y="74" width="140" height="8" rx="2" fill="#94a3b8"/>
    <!-- Sello de acreditación formativa -->
    <circle cx="100" cy="103" r="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <path d="M 97,103 L 99,105 L 103,101" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
