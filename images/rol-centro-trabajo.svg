<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" aria-hidden="true" role="img">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)" rx="16"/>

  <!-- Engranajes abstractos de productividad formativa de fondo -->
  <g opacity="0.12" fill="#0284c7">
    <path d="M 680,100 L 690,100 L 692,85 L 682,80 L 687,70 L 675,65 L 670,75 L 655,75 L 650,65 L 638,70 L 643,80 L 633,85 L 635,100 L 645,105 L 642,120 L 655,125 L 660,115 L 675,115 L 680,125 L 692,120 L 687,105 Z"/>
    <circle cx="663" cy="95" r="16" fill="#f8fafc"/>
  </g>

  <!-- Tarjeta de Espacio Laboral / Plan de Capacitación -->
  <g filter="url(#shadow4)" transform="translate(100, 60)">
    <!-- Marco de tablero kanban / plan de trabajo formativo -->
    <rect x="0" y="0" width="600" height="330" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Barra superior del plan formativo -->
    <rect x="0" y="0" width="600" height="52" rx="12" fill="#0f766e"/>
    <rect x="0" y="40" width="600" height="12" fill="#0f766e"/>

    <circle cx="35" cy="26" r="12" fill="#ffffff" opacity="0.9"/>
    <!-- Icono de portafolio o centro laboral -->
    <rect x="27" y="20" width="16" height="12" rx="2" fill="#0f766e"/>
    <rect x="65" y="20" width="180" height="12" rx="3" fill="#ffffff" opacity="0.9"/>

    <!-- 3 Columnas del plan formativo: Inducción, Actividades y Seguimiento -->
    <!-- Columna 1: Inducción -->
    <g transform="translate(25, 75)">
      <rect x="0" y="0" width="165" height="230" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="15" y="15" width="80" height="10" rx="3" fill="#64748b"/>
      <!-- Tarjeta 1.1 -->
      <rect x="12" y="40" width="141" height="55" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <line x1="24" y1="55" x2="110" y2="55" stroke="#1e293b" stroke-width="2.5"/>
      <line x1="24" y1="68" x2="85" y2="68" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="135" cy="80" r="6" fill="#10b981"/>
      <!-- Tarjeta 1.2 -->
      <rect x="12" y="105" width="141" height="55" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <line x1="24" y1="120" x2="120" y2="120" stroke="#1e293b" stroke-width="2.5"/>
      <line x1="24" y1="133" x2="75" y2="133" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="135" cy="145" r="6" fill="#10b981"/>
    </g>

    <!-- Columna 2: Competencias y Prácticas -->
    <g transform="translate(217, 75)">
      <rect x="0" y="0" width="165" height="230" rx="8" fill="#f0fdfa" stroke="#ccfbf1"/>
      <rect x="15" y="15" width="100" height="10" rx="3" fill="#0f766e"/>
      <!-- Tarjeta 2.1 (En proceso formativo) -->
      <rect x="12" y="40" width="141" height="70" rx="6" fill="#ffffff" stroke="#99f6e4"/>
      <line x1="24" y1="55" x2="125" y2="55" stroke="#115e59" stroke-width="2.5"/>
      <line x1="24" y1="68" x2="95" y2="68" stroke="#64748b" stroke-width="2"/>
      <!-- Barra de progreso -->
      <rect x="24" y="86" width="117" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="24" y="86" width="80" height="6" rx="3" fill="#0d9488"/>

      <!-- Tarjeta 2.2 -->
      <rect x="12" y="120" width="141" height="55" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <line x1="24" y1="135" x2="105" y2="135" stroke="#1e293b" stroke-width="2.5"/>
      <line x1="24" y1="148" x2="80" y2="148" stroke="#94a3b8" stroke-width="2"/>
    </g>

    <!-- Columna 3: Tutoría y Seguimiento mutuo -->
    <g transform="translate(410, 75)">
      <rect x="0" y="0" width="165" height="230" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="15" y="15" width="90" height="10" rx="3" fill="#0284c7"/>
      <!-- Tarjeta de sesión de mentoría -->
      <rect x="12" y="40" width="141" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="32" cy="62" r="12" fill="#dbeafe"/>
      <circle cx="32" cy="58" r="5" fill="#0284c7"/>
      <line x1="52" y1="58" x2="125" y2="58" stroke="#1e293b" stroke-width="2.5"/>
      <line x1="52" y1="68" x2="105" y2="68" stroke="#94a3b8" stroke-width="2"/>
      <!-- Símbolo de feedback / diálogo -->
      <path d="M 24,96 L 36,96 L 42,105 L 42,96 L 130,96" stroke="#0284c7" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
