<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" aria-hidden="true" role="img">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Fondo de oficina formativa / taller -->
  <rect width="800" height="450" fill="url(#bgGrad2)" rx="16"/>

  <!-- Pizarra o ventana de fondo con diagramas abstractos -->
  <g opacity="0.6">
    <rect x="250" y="40" width="300" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="280" y1="70" x2="360" y2="70" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="280" y1="85" x2="330" y2="85" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Gráfica de progreso formativo -->
    <polyline points="400,150 430,125 460,135 490,95 520,80" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="520" cy="80" r="4" fill="#0284c7"/>
    <circle cx="490" cy="95" r="3.5" fill="#38bdf8"/>
    <circle cx="460" cy="135" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Estantería lateral con carpetas y libros -->
  <g transform="translate(60, 80)" opacity="0.7">
    <rect x="0" y="0" width="120" height="180" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="120" x2="120" y2="120" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Libros/manuales formativos -->
    <rect x="15" y="15" width="16" height="45" rx="2" fill="#0284c7"/>
    <rect x="35" y="20" width="14" height="40" rx="2" fill="#0f766e"/>
    <rect x="53" y="12" width="18" height="48" rx="2" fill="#f59e0b"/>
    <rect x="75" y="25" width="22" height="35" rx="2" fill="#64748b"/>
    <!-- Archivadores -->
    <rect x="15" y="75" width="24" height="45" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <circle cx="27" cy="108" r="3" fill="#94a3b8"/>
    <rect x="45" y="75" width="24" height="45" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <circle cx="57" cy="108" r="3" fill="#94a3b8"/>
  </g>

  <!-- Mesa / Escritorio de trabajo central -->
  <g filter="url(#shadow2)">
    <!-- Superficie del escritorio -->
    <rect x="140" y="280" width="520" height="24" rx="4" fill="url(#deskGrad)"/>
    <!-- Patas del escritorio -->
    <rect x="170" y="304" width="18" height="105" rx="2" fill="#64748b"/>
    <rect x="612" y="304" width="18" height="105" rx="2" fill="#64748b"/>
    <!-- Soportes / travesaño -->
    <line x1="170" y1="340" x2="630" y2="340" stroke="#94a3b8" stroke-width="3"/>
  </g>

  <!-- Figura estilizada del Aprendiz (sentado a la izquierda, trabajando en laptop) -->
  <g transform="translate(220, 160)">
    <!-- Silla de oficina -->
    <ellipse cx="60" cy="170" rx="40" ry="10" fill="#334155" opacity="0.2"/>
    <rect x="55" y="140" width="10" height="30" fill="#475569"/>
    <!-- Cabeza (silueta sin rostro) -->
    <circle cx="60" cy="30" r="22" fill="#38bdf8"/>
    <!-- Cabello / silueta -->
    <path d="M 42,26 C 42,12 52,8 64,8 C 76,8 82,14 82,24 C 76,22 68,22 60,25 Z" fill="#0369a1"/>
    <!-- Torso -->
    <path d="M 38,56 C 45,52 75,52 82,56 L 86,130 L 34,130 Z" fill="#0284c7"/>
    <!-- Brazo extendido hacia la laptop -->
    <path d="M 75,70 L 105,95 L 125,120" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Computadora portátil en el escritorio -->
  <g transform="translate(340, 235)">
    <!-- Pantalla abierta -->
    <polygon points="10,0 70,0 65,45 15,45" fill="#1e293b"/>
    <polygon points="14,4 66,4 62,41 18,41" fill="#e0f2fe"/>
    <!-- Diagrama / código abstracto en la pantalla -->
    <line x1="24" y1="12" x2="52" y2="12" stroke="#0284c7" stroke-width="2"/>
    <line x1="24" y1="20" x2="44" y2="20" stroke="#0f766e" stroke-width="2"/>
    <line x1="24" y1="28" x2="56" y2="28" stroke="#f59e0b" stroke-width="2"/>
    <!-- Base del teclado -->
    <polygon points="0,45 80,45 88,50 -8,50" fill="#64748b"/>
  </g>

  <!-- Documentos y taza de café en el escritorio -->
  <g transform="translate(435, 260)">
    <rect x="0" y="5" width="40" height="20" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <line x1="6" y1="11" x2="34" y2="11" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="6" y1="17" x2="26" y2="17" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Taza -->
    <rect x="50" y="8" width="14" height="16" rx="2" fill="#0f766e"/>
    <path d="M 64,12 C 67,12 67,18 64,18" fill="none" stroke="#0f766e" stroke-width="2"/>
  </g>

  <!-- Figura estilizada del Tutor / Mentor (de pie a la derecha, guiando y señalando) -->
  <g transform="translate(480, 120)">
    <!-- Cabeza (silueta sin rostro) -->
    <circle cx="65" cy="30" r="24" fill="#0f766e"/>
    <!-- Silueta de cabello/peinado profesional -->
    <path d="M 45,26 C 45,10 55,6 70,6 C 85,6 90,14 88,24 C 80,20 70,22 62,25 Z" fill="#134e4a"/>
    <!-- Torso -->
    <path d="M 40,58 C 50,54 80,54 90,58 L 94,170 L 36,170 Z" fill="#115e59"/>
    <!-- Cuello de camisa / detalle -->
    <polygon points="60,56 65,70 70,56" fill="#ffffff"/>
    <!-- Brazo izquierdo señalando cordialmente hacia la pantalla -->
    <path d="M 46,75 L 10,110 L -40,125" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-40" cy="125" r="7" fill="#0f766e"/>
    <!-- Piernas -->
    <rect x="42" y="170" width="18" height="150" rx="4" fill="#1e293b"/>
    <rect x="70" y="170" width="18" height="150" rx="4" fill="#1e293b"/>
  </g>

  <!-- Burbuja de diálogo o idea colaborativa abstracta -->
  <g transform="translate(390, 80)" filter="url(#shadow2)">
    <circle cx="30" cy="30" r="26" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <path d="M 20,30 L 26,36 L 40,22" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="20,52 26,62 34,54" fill="#ffffff"/>
    <line x1="20" y1="52" x2="26" y2="62" stroke="#0284c7" stroke-width="2"/>
  </g>
</svg>
